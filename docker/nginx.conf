# add_header inside a location drops every server-level add_header,
# so Cache-Control is chosen here and all headers stay at server level.
map $uri $cache_control {
    ~^/assets/          "public, max-age=31536000, immutable";
    default             "no-cache";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Same role as the Vite dev proxy: the app calls /api/v1 on its own origin.
    # Resolver + variable so nginx still starts when DNS is not ready yet at boot.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $api_upstream api.rumahalambahagia.com;

    location /api/ {
        proxy_pass https://$api_upstream;
        proxy_set_header Host $api_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $api_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA fallback for vue-router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }
}
